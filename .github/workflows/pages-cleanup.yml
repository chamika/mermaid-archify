name: Pages preview cleanup

# Every PR preview (https://pr-<n>.mermaid-archify.pages.dev and its per-commit URLs)
# is deleted when the PR closes. The daily sweep catches anything a failed or missed run left behind.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  pr-closed:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    # Same group as the PR's deploy job in ci.yml: wait for an in-flight deploy, then delete it too.
    concurrency:
      group: pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete preview deployments
        run: node scripts/pages-cleanup.mjs --pr ${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Mark preview comment as removed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              const body = [marker, '## Preview deployment', '', '_Removed: this PR is closed._'].join('\n');
              await github.rest.issues.updateComment({ ...issue, comment_id: existing.id, body });
            }

  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: pages-sweep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete previews of PRs that are no longer open
        run: |
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number -q '[.[].number] | join(",")')
          echo "open PRs: ${OPEN:-none}"
          node scripts/pages-cleanup.mjs --sweep "$OPEN"
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
